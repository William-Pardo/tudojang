schema: spec-driven

context: |
  Tech stack: React 18 + TypeScript, Firebase/Firestore, react-hook-form, framer-motion
  Testing: Jest 29, ts-jest, @testing-library/react, @testing-library/user-event
  State: Context API (DataContext, NotificacionContext)
  Commits: Conventional commits (feat, fix, test, refactor, chore)
  Domain: Tudojang — plataforma SaaS multi-tenant para gestión de dojangs de Taekwondo
  Patterns: Container-Presentational, mocks completos de Firebase en tests
  TDD tracker: .agent/tdd-tracker/ contiene estado y prompts del proceso de cobertura

rules:
  proposal:
    - Incluir siempre una sección de "Impact" con archivos de test afectados
    - Mencionar el coverage actual y el target de cobertura esperado
  design:
    - Documentar la estrategia de mocking para los tests
    - Incluir decisiones sobre qué herramientas/patrones de testing usar
  tasks:
    - Cada tarea debe incluir un sub-item de "Escribir/actualizar tests"
    - Incluir el comando de verificación de coverage como último sub-item
    - "Ejecutar npx jest <archivo> --coverage --coverageReporters=text y pegar el resultado en el chat"
    - Break tasks into chunks of max 2 hours
