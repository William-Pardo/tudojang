name: Recordatorio de rotación de secretos

# Corre solo, sin intervención humana, cada 3 meses -- abre un Issue con un checklist de
# las claves reales del proyecto para que la rotación deje de depender de que alguien se
# acuerde. La rotación en sí sigue siendo manual a propósito (ver discusión 2026-07-31):
# automatizarla del todo significa que un script podría cortar el envío de emails/otros
# servicios en producción sin que nadie se entere hasta que un usuario se queje. Este
# workflow solo recuerda -- nunca toca una clave real.

on:
  schedule:
    # Dia 1 de Enero/Abril/Julio/Octubre, 9am UTC -- cadencia trimestral.
    - cron: '0 9 1 */3 *'
  workflow_dispatch: {} # permite dispararlo a mano para probarlo sin esperar al cron

jobs:
  crear-recordatorio:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Crear issue de recordatorio
        uses: actions/github-script@v7
        with:
          script: |
            const secretos = [
              { nombre: 'RESEND_API_KEY', donde: 'Google Secret Manager', accion: 'Generar clave nueva en resend.com/api-keys, correr `firebase functions:secrets:set RESEND_API_KEY --project tudojang`, redeployar Functions, y recien ahi revocar la vieja en Resend.' },
              { nombre: 'GEMINI_API_KEY', donde: 'Google Secret Manager', accion: 'Generar clave nueva en aistudio.google.com/apikey (proyecto tudojang), `firebase functions:secrets:set GEMINI_API_KEY --project tudojang`, redeployar Functions.' },
              { nombre: 'WOMPI_EVENTS_SECRET', donde: 'GitHub Secret (se inyecta a functions/.env en cada deploy)', accion: 'Regenerar en el dashboard de Wompi y actualizar con `gh secret set WOMPI_EVENTS_SECRET`.' },
              { nombre: 'VITE_WOMPI_PUBLIC_KEY / VITE_WOMPI_INTEGRITY_SECRET', donde: 'GitHub Secrets', accion: 'Regenerar en el dashboard de Wompi y actualizar con `gh secret set`.' },
              { nombre: 'FIREBASE_SERVICE_ACCOUNT', donde: 'GitHub Secret', accion: 'Generar una cuenta de servicio nueva en IAM (Google Cloud Console) con los mismos roles, actualizar con `gh secret set`, y recien ahi deshabilitar la vieja.' },
              { nombre: 'VITE_RECAPTCHA_ENTERPRISE_SITE_KEY', donde: 'GitHub Secret', accion: 'Prioridad baja -- es una site key publica por diseño (viaja en el bundle del cliente), no un secreto real. Revisar igual cada tanto que siga restringida a los dominios correctos.' },
            ];

            const filas = secretos
              .map((s) => `- [ ] **${s.nombre}** (${s.donde})\n  - ${s.accion}`)
              .join('\n');

            const cuerpo = [
              '## Rotación trimestral de secretos',
              '',
              'Recordatorio automático (workflow `recordatorio-rotacion-secretos.yml`) -- revisar y rotar las claves reales del proyecto. No rota nada solo, es un checklist para hacer a mano.',
              '',
              filas,
              '',
              '### Patrón general para rotar cualquiera de estas',
              '1. Generar la clave nueva en el proveedor real (nunca reusar la vieja).',
              '2. Actualizarla donde corresponda (Secret Manager o GitHub Secret, según la tabla de arriba).',
              '3. Redeployar (`firebase deploy --only functions` para las de Secret Manager, o esperar el próximo push a `main` para las de GitHub Secrets).',
              '4. Confirmar que todo sigue funcionando antes de tocar la vieja.',
              '5. Recién ahí, revocar/eliminar la clave anterior en el proveedor.',
              '',
              '_Cerrá este issue cuando termines la rotación de este trimestre._',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Rotación trimestral de secretos — ${new Date().toISOString().slice(0, 10)}`,
              body: cuerpo,
            });
