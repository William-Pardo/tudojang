name: Deploy to Firebase

# Disparadores ampliados el 2026-07-22 para poder VALIDAR el gate de pruebas sin deployar.
#
# Antes solo disparaba en push a `main`, asi que la unica forma de ver correr el job
# `pruebas` era mergear a main... que deploya a produccion. Pesimo lugar para descubrir que
# el workflow tiene un error de sintaxis o que el emulador no levanta en el runner.
#
# Ahora corre en cualquier rama y en pull requests. OJO: el trigger es a nivel de workflow,
# asi que alcanza a AMBOS jobs -- por eso `build_and_deploy` lleva un `if:` explicito que lo
# restringe a push sobre `main` y a ejecuciones manuales. Sin ese `if`, abrir un PR
# deployaria a produccion.
'on':
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

# Evita quemar minutos de Actions en corridas que ya quedaron obsoletas por un push nuevo.
# En `main` NO se cancela: interrumpir un deploy a mitad de camino es peor que gastar unos
# minutos de mas.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '20'

jobs:
  # Gate de calidad previo al deploy (agregado 2026-07-22).
  #
  # Hasta ahora el pipeline hacia `npm run build` y deployaba directo: ni un solo test
  # corria antes de publicar a produccion, aunque el repo tiene ~1900 pruebas entre app,
  # Cloud Functions, scripts y reglas de Firestore. Se conecta recien ahora porque hasta
  # este commit habia 5 suites en rojo de forma permanente; un gate que nace fallando solo
  # entrena al equipo a ignorarlo.
  #
  # Los cinco comandos se verificaron localmente antes de wirearlos (typecheck 0 errores,
  # app 1506 pass, functions 263+96 pass, scripts 7 pass, reglas 78 pass contra emulador).
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # El emulador de Firestore corre sobre la JVM. Se instala antes que nada para que un
      # fallo de setup salga temprano y no despues de cuatro minutos de tests.
      - name: Setup Java (requerido por el emulador de Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Install Functions dependencies
        run: npm --prefix functions install

      # No requiere secretos: firebase/config.ts cae a modo simulado sin variables de
      # entorno, que es justo lo que las pruebas esperan.
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Pruebas de la app
        run: npm run test:app

      - name: Pruebas de Cloud Functions
        run: npm run test:functions:full

      - name: Pruebas de scripts operativos
        run: npm run test:node

      # Unica capa que valida de verdad el enforcement de firestore.rules -- entre otras
      # cosas, que un cliente no pueda saltarse el limite de estudiantes del plan
      # escribiendo directo. Levanta el emulador real contra un proyecto demo.
      - name: Reglas de Firestore contra el emulador
        run: npm run test:firestore-rules

  build_and_deploy:
    needs: pruebas
    # GUARDA CRITICA: el workflow ahora dispara en cualquier rama y en pull requests para
    # poder validar el job `pruebas`. Sin esta condicion, cada uno de esos eventos deployaria
    # a produccion. Solo se deploya en push a `main` o cuando alguien lo lanza a mano.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_WOMPI_PUBLIC_KEY: ${{ secrets.VITE_WOMPI_PUBLIC_KEY }}
          VITE_WOMPI_INTEGRITY_SECRET: ${{ secrets.VITE_WOMPI_INTEGRITY_SECRET }}
          # Flags del asistente virtual (WS, shared/soporte/flags.ts). NO son secretos --
          # son booleanos publicos que terminan igual en el bundle del cliente -- por eso
          # van como valor literal aca, no como secrets.*. Sin estas 3 lineas, vite.config.ts
          # las recibe `undefined` en CI (el runner no tiene .env.local) y
          # obtenerBanderasAsistente() cae siempre a su default (aiEnabled: false), aunque
          # la Cloud Function consultarAsistenteIa y la API key de Gemini esten
          # correctamente desplegadas -- bug real detectado 2026-07-29.
          VITE_ASSISTANT_CATALOG_V1: 'true'
          VITE_ASSISTANT_AI_ENABLED: 'true'
          VITE_ASSISTANT_ESCALATION_ENABLED: 'true'

      # El bundle recien existe aca, y compilado CON los secretos reales -- que es la unica
      # condicion en la que este chequeo significa algo. En el job `pruebas` no hay `dist/`
      # (se saltea) y compilarlo sin secretos lo haria pasar trivialmente.
      # Corre ANTES de publicar: si el bundle filtra una credencial, el deploy no ocurre.
      - name: Verificar que el bundle no filtre secretos
        run: npm run test:bundle-security

      - name: Install Functions dependencies
        run: npm --prefix functions install

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: tudojang

      # AGREGADO 2026-07-22. El paso de abajo se llamaba "Deploy Functions and Rules" pero su
      # comando era `--only functions`: las reglas NUNCA se desplegaban. El nombre mentia.
      #
      # Se descubrio justo despues de publicar `crearEstudiante`, la Cloud Function que valida
      # el limite de alumnos del plan: la funcion quedo en produccion, pero la regla que cierra
      # la puerta trasera (`allow create: if false` sobre estudiantes/{id}) no. O sea, un write
      # directo desde el cliente seguia creando estudiantes sin limite -- justo el agujero que
      # habiamos verificado contra el emulador con 78 tests en verde. Verificamos la regla
      # correcta; nunca llegaba al servidor.
      #
      # `firebase.json` declara ademas indices de Firestore y reglas de Storage, que tampoco
      # se desplegaban nunca. Se incluyen los tres.
      #
      # VA ANTES QUE LAS FUNCTIONS a proposito: hoy el paso de functions falla por un permiso
      # de Cloud Scheduler (ver ACCIONES_PENDIENTES.md), y un paso posterior a uno fallido no
      # se ejecuta. Poniendolo antes, las reglas se publican aunque las functions fallen. No
      # hay ventana de rotura por el orden: `crearEstudiante` ya esta en produccion.
      - name: Deploy Firestore rules, indexes y Storage rules
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$HOME/gcp_key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/gcp_key.json"
          npx firebase-tools deploy --only firestore:rules,firestore:indexes,storage --force --project tudojang

      - name: Deploy Functions
        run: |
          echo "WOMPI_EVENTS_SECRET=${{ secrets.WOMPI_EVENTS_SECRET }}" > functions/.env
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$HOME/gcp_key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/gcp_key.json"
          npx firebase-tools deploy --only functions --force --project tudojang
