<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a365d" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TuDojang" />
  <title>Tudojang SaaS - Gestión Premium</title>

  <script>
    // Inicialización del tema
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    // Registro del Service Worker — SOLO en producción.
    // Fix 2026-07-21: en localhost el SW cachea de forma agresiva y, si el dev server se cae o
    // reinicia, intercepta la navegación y la rompe con un error críptico ("Failed to convert
    // value to 'Response'"), impidiendo que la app arranque -- justo lo que pasaba con la vuelta
    // del OAuth de Drive. En desarrollo NO lo queremos (además estorba el HMR): no lo registramos
    // y, de paso, desregistramos cualquier SW que haya quedado instalado de una sesión anterior.
    if ('serviceWorker' in navigator) {
      const esLocalhost = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
      if (esLocalhost) {
        navigator.serviceWorker.getRegistrations()
          .then(regs => regs.forEach(reg => reg.unregister()))
          .catch(() => { /* nada que limpiar */ });
      } else {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            console.log('SW registrado', reg);
          }).catch(err => {
            console.log('Error SW', err);
          });
        });
      }
    }
  </script>

  <link rel="stylesheet" href="/index.css?v=1.0.6">
</head>

<body class="bg-tkd-gray dark:bg-tkd-dark overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
