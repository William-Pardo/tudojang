<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Tudojang Relay</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #003b8f;
      --red: #c91f2b;
      --ink: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --soft: #f8fafc;
      --green: #15803d;
      --amber: #b45309;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 360px;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: var(--ink);
    }

    header {
      padding: 16px;
      background: var(--blue);
      color: white;
    }

    h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 11px;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    main {
      padding: 14px;
    }

    .section {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      background: white;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .value {
      font-size: 13px;
      font-weight: 700;
      text-align: right;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-radius: 999px;
      background: var(--soft);
      font-size: 12px;
      font-weight: 700;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--muted);
    }

    .status.running .dot {
      background: var(--green);
    }

    .status.waiting .dot,
    .status.paused .dot {
      background: var(--amber);
    }

    .status.done .dot {
      background: var(--blue);
    }

    .status.cancelled .dot,
    .status.error .dot {
      background: var(--red);
    }

    .progress {
      width: 100%;
      height: 9px;
      background: #edf2f7;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--blue), var(--red));
      transition: width 0.2s ease;
    }

    .message-title {
      margin: 4px 0 2px;
      font-size: 14px;
      font-weight: 800;
    }

    .message-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: white;
      color: var(--ink);
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }

    button.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
    }

    button.danger {
      background: var(--red);
      border-color: var(--red);
      color: white;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    details {
      margin-top: 8px;
      font-size: 12px;
    }

    summary {
      cursor: pointer;
      font-weight: 700;
    }

    .failed-list {
      margin: 8px 0 0;
      padding-left: 16px;
      color: var(--muted);
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      margin: 0;
    }
  </style>
</head>

<body>
  <header>
    <h1>Tudojang Relay</h1>
    <div class="subtitle">WhatsApp Assistant</div>
  </header>

  <main>
    <section class="section">
      <div class="row">
        <div>
          <div class="label">Estado</div>
          <div id="status" class="status"><span class="dot"></span><span>Sin lote activo</span></div>
        </div>
        <button id="openWhatsapp">Abrir WhatsApp</button>
      </div>
    </section>

    <section class="section">
      <div class="row">
        <div>
          <div class="label">Lote actual</div>
          <div id="batch" class="message-title">0 de 0</div>
        </div>
        <div>
          <div class="label">Tanda</div>
          <div id="batchNumber" class="value">0 / 0</div>
        </div>
      </div>
      <div class="progress"><div id="bar" class="bar"></div></div>
      <div class="row" style="margin-top:10px">
        <div class="message-meta">Enviados: <strong id="sent">0</strong></div>
        <div class="message-meta">Fallidos: <strong id="failed">0</strong></div>
        <div class="message-meta">Omitidos: <strong id="skipped">0</strong></div>
      </div>
      <p id="nextAction" class="hint" style="margin-top:10px"></p>
    </section>

    <section class="section">
      <div class="label">Mensaje actual</div>
      <div id="currentName" class="message-title">Sin mensaje en curso</div>
      <div id="currentMeta" class="message-meta">Genera un lote desde Tudojang para iniciar Relay.</div>
    </section>

    <section class="section">
      <div class="actions">
        <button id="pause">Pausar</button>
        <button id="resume" class="primary">Continuar</button>
        <button id="skip">Saltar actual</button>
        <button id="cancel" class="danger">Cancelar</button>
      </div>
      <details>
        <summary>Fallidos recientes</summary>
        <ul id="failedList" class="failed-list"></ul>
      </details>
    </section>
  </main>

  <script src="popup.js"></script>
</body>

</html>
